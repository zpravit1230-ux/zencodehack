{% extends "base.html" %}
{% block title %}Server Error (500) - {{ app_name }}{% endblock %}
{% block content %}
<div class="empty-state" style="border-color: var(--danger-border); max-width: 600px; margin: 3rem auto;">
  <a href="{{ url_for('main.index') }}" class="icon-heading-link" style="display:inline-block; margin-bottom: 0.5rem;" title="Click to return to dashboard">
    <div style="font-size: 3rem; color: var(--danger); margin-bottom: 0.5rem;">⚠️</div>
    <h2>500 - Internal Server Error</h2>
  </a>
  <p style="margin: 1rem 0;">An unexpected error occurred while processing your request. Please try again or notify the team.</p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
