{% extends "base.html" %}
{% block title %}Access Denied (403) - {{ app_name }}{% endblock %}
{% block content %}
<div class="empty-state" style="border-color: var(--danger-border); max-width: 600px; margin: 3rem auto;">
  <a href="{{ url_for('main.index') }}" class="icon-heading-link" style="display:inline-block; margin-bottom: 0.5rem;" title="Click to return to home">
    <div style="font-size: 3rem; color: var(--danger); margin-bottom: 0.5rem;">🚫</div>
    <h2>403 - Access Forbidden</h2>
  </a>
  <p style="margin: 1rem 0;">You do not have the required permissions to view this page or perform this action.</p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
