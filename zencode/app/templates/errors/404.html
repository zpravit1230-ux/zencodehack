{% extends "base.html" %}
{% block title %}Page Not Found (404) - {{ app_name }}{% endblock %}
{% block content %}
<div class="empty-state" style="max-width: 600px; margin: 3rem auto;">
  <a href="{{ url_for('main.index') }}" class="icon-heading-link" style="display:inline-block; margin-bottom: 0.5rem;" title="Click to return to home">
    <div style="font-size: 3rem; color: var(--warning); margin-bottom: 0.5rem;">🔍</div>
    <h2>404 - Page Not Found</h2>
  </a>
  <p style="margin: 1rem 0;">The page or content version you are looking for does not exist or has been moved.</p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return to Home</a>
</div>
{% endblock %}
